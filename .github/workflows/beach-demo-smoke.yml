name: Beach demo Godot smoke test

on:
  push:
    branches: [integration/stable-baseline, feature/beach-demo-elevated-camera, feature/creature-growth-takeover, feature/sculpted-coastal-art, feature/extended-coast-population, feature/cocoon-evolution-coastal-suburb, feature/expanded-suburb-shops-cars-debug, feature/giant-demolition-upright-feeding, feature/debug-batch-evolution, feature/scale-driven-diet-transition, feature/defcon-response-escalation, feature/outer-district-offscreen-defcon]
  pull_request:
    paths:
      - 'assets/**'
      - 'scripts/beach/**'
      - 'scenes/BeachDemo.tscn'
      - 'project.godot'
      - 'scripts/ci/**'
      - '.github/workflows/beach-demo-smoke.yml'

jobs:
  godot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.5
        run: |
          curl -fLsS --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5-stable_linux.x86_64
      - name: Import, launch and exercise every gameplay suite
        run: python3 scripts/ci/run_regressions.py --godot /tmp/godot/Godot_v4.5-stable_linux.x86_64
      - name: Retain regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-regression-results-${{ github.run_number }}
          path: build/regressions/
          retention-days: 30
