name: Android debug APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'assets/**'
      - 'scripts/**'
      - 'scenes/**'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kaijustomp-apk-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_VERSION: '4.5'
      GODOT_CHANNEL: stable
      BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Check out Kaijustomp
        uses: actions/checkout@v4

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install matching Godot editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_TAG="${GODOT_VERSION}-${GODOT_CHANNEL}"
          ROOT="https://github.com/godotengine/godot/releases/download/${GODOT_TAG}"
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/godot-templates"
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            "${ROOT}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$RUNNER_TEMP/godot/Godot_v${GODOT_TAG}_linux.x86_64"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot-templates.tpz" \
            "${ROOT}/Godot_v${GODOT_TAG}_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/godot-templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          test -f "$RUNNER_TEMP/godot-templates/templates/android_debug.apk"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          "$GODOT_BIN" --headless --version

      - name: Prepare Android debug signing key
        shell: bash
        env:
          KAIJUSTOMP_DEBUG_KEYSTORE_BASE64: ${{ secrets.KAIJUSTOMP_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/kaijustomp-debug.keystore"
          if [ -n "$KAIJUSTOMP_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$KAIJUSTOMP_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            echo "Using stable test-signing certificate from GitHub Actions secret"
          else
            keytool -genkeypair -noprompt -keyalg RSA -keysize 2048 -validity 10000 \
              -keystore "$KEYSTORE" -alias androiddebugkey \
              -storepass android -keypass android \
              -dname "CN=Kaijustomp Test,O=Kaijustomp,C=AU"
            echo "::warning::No stable signing secret configured. APK updates may require uninstalling the previous debug APK."
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure Godot Android editor settings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project and check scripts
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path . --quit 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          if grep -E 'SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/godot-import.log"; then
            echo "::error::Godot reported a GDScript parse error"
            exit 1
          fi

      - name: Verify evolution shedding before publishing APK
        shell: bash
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --path . --script res://scripts/ci/test_evolution.gd \
            2>&1 | tee "$RUNNER_TEMP/evolution-test.log"
          grep -q 'EVOLUTION TEST PASSED' "$RUNNER_TEMP/evolution-test.log"
          if grep -E 'SCRIPT ERROR|Parse Error|EVOLUTION TEST FAILED|Invalid call|Invalid access' "$RUNNER_TEMP/evolution-test.log"; then
            exit 1
          fi

      - name: Verify building collision, destruction and projectile cover
        shell: bash
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --path . --script res://scripts/ci/test_beach_combat.gd \
            2>&1 | tee "$RUNNER_TEMP/beach-combat-test.log"
          grep -q 'DESTRUCTION TEST PASSED' "$RUNNER_TEMP/beach-combat-test.log"
          if grep -E 'SCRIPT ERROR|Parse Error|DESTRUCTION TEST FAILED|Invalid call|Invalid access' "$RUNNER_TEMP/beach-combat-test.log"; then
            exit 1
          fi

      - name: Verify styled creature silhouette and cumulative mutations
        shell: bash
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --path . --script res://scripts/ci/test_stylized_creature.gd \
            2>&1 | tee "$RUNNER_TEMP/stylized-creature-test.log"
          grep -q 'STYLIZED CREATURE TEST PASSED' "$RUNNER_TEMP/stylized-creature-test.log"
          if grep -E 'SCRIPT ERROR|Parse Error|STYLIZED CREATURE TEST FAILED|Invalid call|Invalid access' "$RUNNER_TEMP/stylized-creature-test.log"; then
            exit 1
          fi

      - name: Verify sparse growth milestones and upright body transition
        shell: bash
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --path . --script res://scripts/ci/test_growth_milestones.gd \
            2>&1 | tee "$RUNNER_TEMP/growth-test.log"
          grep -q 'GROWTH TEST PASSED' "$RUNNER_TEMP/growth-test.log"
          if grep -E 'SCRIPT ERROR|Parse Error|GROWTH TEST FAILED|Invalid call|Invalid access' "$RUNNER_TEMP/growth-test.log"; then
            exit 1
          fi

      - name: Verify growth gameplay, paused posture and portrait framing
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --script res://scripts/ci/test_growth_gameplay.gd \
            2>&1 | tee "$RUNNER_TEMP/growth-gameplay-test.log"
          grep -q 'GROWTH GAMEPLAY TEST PASSED' "$RUNNER_TEMP/growth-gameplay-test.log"
          if grep -E 'SCRIPT ERROR|Parse Error|TEST FAILED|Invalid call|Invalid access' "$RUNNER_TEMP/growth-gameplay-test.log"; then exit 1; fi

      - name: Verify coastal art budgets and portrait layouts
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --script res://scripts/ci/test_coastal_art.gd 2>&1 | tee "$RUNNER_TEMP/coastal-art.log"
          grep -q 'COASTAL ART TEST PASSED' "$RUNNER_TEMP/coastal-art.log"
          if grep -E 'SCRIPT ERROR|Parse Error|TEST FAILED|Invalid call|Invalid access' "$RUNNER_TEMP/coastal-art.log"; then exit 1; fi

      - name: Verify extended beach and renewable local population
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --script res://scripts/ci/test_long_beach.gd 2>&1 | tee "$RUNNER_TEMP/long-beach.log"
          grep -q 'LONG BEACH TEST PASSED' "$RUNNER_TEMP/long-beach.log"
          if grep -E 'SCRIPT ERROR|Parse Error|TEST FAILED|Invalid call|Invalid access' "$RUNNER_TEMP/long-beach.log"; then exit 1; fi

      - name: Verify cocoon mutation and first inland neighbourhood
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --script res://scripts/ci/test_suburb_evolution.gd 2>&1 | tee "$RUNNER_TEMP/suburb-evolution.log"
          grep -q 'SUBURB EVOLUTION TEST PASSED' "$RUNNER_TEMP/suburb-evolution.log"
          if grep -E 'SCRIPT ERROR|Parse Error|TEST FAILED|Invalid call|Invalid access' "$RUNNER_TEMP/suburb-evolution.log"; then exit 1; fi

      - name: Verify shopping streets, cars and debug free evolution
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --script res://scripts/ci/test_shopping_cars_debug.gd 2>&1 | tee "$RUNNER_TEMP/shopping-cars-debug.log"
          grep -q 'SHOPPING CARS DEBUG TEST PASSED' "$RUNNER_TEMP/shopping-cars-debug.log"
          if grep -E 'SCRIPT ERROR|Parse Error|TEST FAILED|Invalid call|Invalid access' "$RUNNER_TEMP/shopping-cars-debug.log"; then exit 1; fi

      - name: Export portrait Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          sed -i -E "s@^version/code=.*@version/code=${GITHUB_RUN_NUMBER}@" export_presets.cfg
          sed -i -E "s@^version/name=.*@version/name=\"0.1.${GITHUB_RUN_NUMBER}-debug\"@" export_presets.cfg
          if [ "$BUILD_BRANCH" = 'feature/creature-growth-takeover' ]; then
            sed -i 's@^package/unique_name=.*@package/unique_name="com.kavemankai.kaijustomp.creaturepreview"@' export_presets.cfg
            sed -i 's@^package/name=.*@package/name="Kaijustomp Creature Preview"@' export_presets.cfg
          fi
          if [ "$BUILD_BRANCH" = 'feature/sculpted-coastal-art' ]; then
            sed -i 's@^package/unique_name=.*@package/unique_name="com.kavemankai.kaijustomp.artpreview"@' export_presets.cfg
            sed -i 's@^package/name=.*@package/name="Kaijustomp Coastal Art"@' export_presets.cfg
          fi
          if [ "$BUILD_BRANCH" = 'feature/extended-coast-population' ]; then
            sed -i 's@^package/unique_name=.*@package/unique_name="com.kavemankai.kaijustomp.longbeachpreview"@' export_presets.cfg
            sed -i 's@^package/name=.*@package/name="Kaijustomp Long Beach Preview"@' export_presets.cfg
          fi
          if [ "$BUILD_BRANCH" = 'feature/cocoon-evolution-coastal-suburb' ]; then
            sed -i 's@^package/unique_name=.*@package/unique_name="com.kavemankai.kaijustomp.suburbpreview"@' export_presets.cfg
            sed -i 's@^package/name=.*@package/name="Kaijustomp Suburb Preview"@' export_presets.cfg
          fi
          if [ "$BUILD_BRANCH" = 'feature/expanded-suburb-shops-cars-debug' ]; then
            sed -i 's@^package/unique_name=.*@package/unique_name="com.kavemankai.kaijustomp.shoppingpreview"@' export_presets.cfg
            sed -i 's@^package/name=.*@package/name="Kaijustomp Shopping Preview"@' export_presets.cfg
          fi
          APK="Kaijustomp-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}-debug.apk"
          echo "APK_NAME=$APK" >> "$GITHUB_ENV"
          "$GODOT_BIN" --headless --path . --export-debug "Android" "build/android/$APK" \
            2>&1 | tee "$RUNNER_TEMP/godot-export.log"
          test -s "build/android/$APK"
          FILE_BYTES=$(stat -c "%s" "build/android/$APK")
          if [ "$FILE_BYTES" -lt 12000000 ]; then
            echo "APK too small, refusing publication"
            exit 1
          fi
          unzip -t "build/android/$APK" > /dev/null
          python3 scripts/ci/verify_android_16k.py "build/android/$APK"
          # Check the APK contains an Android manifest and native ARM64 engine.
          unzip -Z -1 "build/android/$APK" > "$RUNNER_TEMP/apk-entries.txt"
          grep -qx "AndroidManifest.xml" "$RUNNER_TEMP/apk-entries.txt"
          grep -qx "classes.dex" "$RUNNER_TEMP/apk-entries.txt"
          grep -Eq "^lib/arm64-v8a/.*[.]so$" "$RUNNER_TEMP/apk-entries.txt"
          if grep -E 'SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/godot-export.log"; then
            echo "::error::Godot reported a script error during export"
            exit 1
          fi

      - name: Verify Android APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK="build/android/$APK_NAME"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          grep -E '^(package:|application-label:|launchable-activity:|native-code:)' "$RUNNER_TEMP/apk-badging.txt"
          EXPECTED_PACKAGE='com.kavemankai.kaijustomp'
          if [ "$BUILD_BRANCH" = 'feature/creature-growth-takeover' ]; then
            EXPECTED_PACKAGE='com.kavemankai.kaijustomp.creaturepreview'
          fi
          if [ "$BUILD_BRANCH" = 'feature/sculpted-coastal-art' ]; then
            EXPECTED_PACKAGE='com.kavemankai.kaijustomp.artpreview'
          fi
          if [ "$BUILD_BRANCH" = 'feature/extended-coast-population' ]; then
            EXPECTED_PACKAGE='com.kavemankai.kaijustomp.longbeachpreview'
          fi
          if [ "$BUILD_BRANCH" = 'feature/cocoon-evolution-coastal-suburb' ]; then
            EXPECTED_PACKAGE='com.kavemankai.kaijustomp.suburbpreview'
          fi
          if [ "$BUILD_BRANCH" = 'feature/expanded-suburb-shops-cars-debug' ]; then
            EXPECTED_PACKAGE='com.kavemankai.kaijustomp.shoppingpreview'
          fi
          grep -q "name='$EXPECTED_PACKAGE'" "$RUNNER_TEMP/apk-badging.txt"
          grep -q '^launchable-activity:' "$RUNNER_TEMP/apk-badging.txt"
          grep -q "arm64-v8a" "$RUNNER_TEMP/apk-badging.txt"
          (cd build/android && sha256sum "$APK_NAME") | tee "$APK.sha256"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Kaijustomp-Android-debug-${{ github.run_number }}
          path: build/android/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish immutable creature and evolution candidate
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/creature-growth-takeover'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="creature-evolution-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          sha256sum "build/android/$APK_NAME" > "build/android/$APK_NAME.sha256"
          cat > "$RUNNER_TEMP/candidate-notes.md" <<EOF
          Experimental creature/evolution candidate. Source: ${GITHUB_SHA}. Android build: ${GITHUB_RUN_NUMBER}. Engine: Godot 4.5 Compatibility, portrait, ARM64.

          Fixes scaled feeding reach, upright neck/limb articulation, head collider timing, paused evolution presentation, growth clearance and late camera clipping. L6 has exactly one size increase. Existing approved movement/control constants are retained.

          Passed: import, evolution/shedding, touch/combat/projectile cover, creature composition, milestone cadence, growth gameplay integration, APK ZIP/package/signature and native 16 KiB alignment checks. Workflow: https://github.com/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}

          Package com.kavemankai.kaijustomp.creaturepreview installs alongside the approved beach game. This is debug signed; different signing keys may require uninstalling an older preview. Approved releases are preserved. Phone installation, visual acceptance and sustained device performance still require playtesting. Upright animation is an expandable procedural prototype.
          EOF
          gh release create "$TAG" "build/android/$APK_NAME" "build/android/$APK_NAME.sha256" \
            --target "$GITHUB_SHA" --title "Kaijustomp creature/evolution candidate ${GITHUB_RUN_NUMBER}" \
            --notes-file "$RUNNER_TEMP/candidate-notes.md" --prerelease
          LOCAL_SIZE=$(stat -c "%s" "build/android/$APK_NAME")
          ASSET_SIZE=$(gh release view "$TAG" --json assets --jq ".assets[] | select(.name == \"$APK_NAME\") | .size")
          test "$LOCAL_SIZE" = "$ASSET_SIZE"
          echo "Candidate: https://github.com/${GH_REPO}/releases/download/${TAG}/${APK_NAME}" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish direct-install APK link (preview)
        if: github.ref == 'refs/heads/feature/beach-demo-elevated-camera' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cp "build/android/$APK_NAME" "build/android/Kaijustomp-latest.apk"
          RELEASE_TAG="mobile-preview-godot45"
          RELEASE_TITLE="Kaijustomp — Android 16 KB compatible preview (Godot 4.5)"
          RELEASE_NOTES="Godot 4.5 rebuild with automated 16 KiB native alignment verification. Latest Android debug APK from branch ${GITHUB_REF_NAME}, commit ${GITHUB_SHA}, run ${GITHUB_RUN_NUMBER}. Download Kaijustomp-latest.apk directly on Android; confirm its installation. This preview release uses a stable download tag, not the current commit as the source tag. If using per-run debug signing, an older installation might need uninstalling first."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "build/android/Kaijustomp-latest.apk" --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES" --prerelease
          else
            gh release create "$RELEASE_TAG" "build/android/Kaijustomp-latest.apk" \
              --target "$GITHUB_SHA" --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" --prerelease
          fi
          LOCAL_SIZE=$(stat -c "%s" "build/android/Kaijustomp-latest.apk")
          ASSET_SIZE=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | select(.name == "Kaijustomp-latest.apk") | .size')
          if [ "$LOCAL_SIZE" != "$ASSET_SIZE" ]; then
            echo "Published APK size does not match the verified local APK."
            exit 1
          fi
          echo "Verified published APK size: $LOCAL_SIZE bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "Direct phone link: https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}/Kaijustomp-latest.apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish isolated colourful creature APK
        if: github.ref == 'refs/heads/feature/stylized-creature-colour-polish'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="stylized-creature-preview"
          cp "build/android/$APK_NAME" "build/android/Kaijustomp-stylized-creature.apk"
          NOTES="Stylised colour-based hero creature preview, commit ${GITHUB_SHA}, run ${GITHUB_RUN_NUMBER}. Unchanged approved gameplay, world, camera and colliders. Tested headless but awaiting player visual judgement on Android. Existing stable beach APK not overwritten."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "build/android/Kaijustomp-stylized-creature.apk" --clobber
            gh release edit "$TAG" --title "Kaijustomp — Stylised Creature Preview" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" "build/android/Kaijustomp-stylized-creature.apk" \
              --target "$GITHUB_SHA" --title "Kaijustomp — Stylised Creature Preview" \
              --notes "$NOTES" --prerelease
          fi
          LOCAL_SIZE=$(stat -c "%s" "build/android/Kaijustomp-stylized-creature.apk")
          ASSET_SIZE=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name == "Kaijustomp-stylized-creature.apk") | .size')
          test "$LOCAL_SIZE" = "$ASSET_SIZE"
          echo "Phone APK: https://github.com/${GH_REPO}/releases/download/${TAG}/Kaijustomp-stylized-creature.apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish isolated staged-evolution preview APK
        if: github.ref == 'refs/heads/feature/evolution-growth-milestones'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="evolution-growth-preview"
          cp "build/android/$APK_NAME" "build/android/Kaijustomp-growth-preview.apk"
          NOTES="Growth pacing preview from commit ${GITHUB_SHA}, run ${GITHUB_RUN_NUMBER}: first size milestone L5, then L10/16, upright form at L22, further size growth L28/34 and every six. Regular mutations unchanged. Separate from approved beach APK and stylized creature preview. Build automated tests do not substitute for mobile gameplay/visual review."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "build/android/Kaijustomp-growth-preview.apk" --clobber
            gh release edit "$TAG" --title "Kaijustomp — Staged Growth Preview" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" "build/android/Kaijustomp-growth-preview.apk" \
              --target "$GITHUB_SHA" --title "Kaijustomp — Staged Growth Preview" \
              --notes "$NOTES" --prerelease
          fi
          LOCAL_SIZE=$(stat -c "%s" "build/android/Kaijustomp-growth-preview.apk")
          ASSET_SIZE=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name == "Kaijustomp-growth-preview.apk") | .size')
          test "$LOCAL_SIZE" = "$ASSET_SIZE"
          echo "Preview APK: https://github.com/${GH_REPO}/releases/download/${TAG}/Kaijustomp-growth-preview.apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish immutable shopping district preview
        if: github.ref == 'refs/heads/feature/expanded-suburb-shops-cars-debug' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="shopping-cars-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          cat > "$RUNNER_TEMP/shopping-notes.md" <<EOF
          Expanded Banksia Heights and shopping preview from ${GITHUB_SHA}: 12 new homes, 12 small shops, a supermarket and hardware store on connected streets, 16 physical cars (4 moving), impact demolition/debris and fleeing drivers. Debug-only DEBUG EVO button enables free, immediate mutation choice with normal skin reveal, history and fixed physical growth milestones. Approved beach, camera, joystick and mutation rules preserved. Installs separately as com.kavemankai.kaijustomp.shoppingpreview. On-phone performance, traffic feel and layout require testing.
          EOF
          gh release create "$TAG" "build/android/$APK_NAME" "build/android/$APK_NAME.sha256" --target "$GITHUB_SHA" --title "Kaijustomp shopping/cars ${GITHUB_RUN_NUMBER}" --notes-file "$RUNNER_TEMP/shopping-notes.md" --prerelease
          LOCAL_SIZE=$(stat -c "%s" "build/android/$APK_NAME")
          ASSET_SIZE=$(gh release view "$TAG" --json assets --jq ".assets[] | select(.name == \"$APK_NAME\") | .size")
          test "$LOCAL_SIZE" = "$ASSET_SIZE"

      - name: Publish immutable suburb evolution preview
        if: github.ref == 'refs/heads/feature/cocoon-evolution-coastal-suburb' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="suburb-evolution-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          cat > "$RUNNER_TEMP/suburb-notes.md" <<EOF
          Coastal suburb and evolution preview from ${GITHUB_SHA}. Reinforced Cocoon reduces damage and raises interruption limit during the vulnerable evolution stage; Rapid Metamorphosis shortens that vulnerable stage. Both have three capped visual tiers, and retain the prior safe paused choice/shedding mechanics. Adds a connected inland street and 18 destructible residential homes, local pedestrians and district-aware police, while keeping the long beach and approved mobile camera/controls/art. Distinct installable package com.kavemankai.kaijustomp.suburbpreview. Godot automated test and Android export are CI gated; real phone performance and player acceptance still need confirmation.
          EOF
          gh release create "$TAG" "build/android/$APK_NAME" "build/android/$APK_NAME.sha256" --target "$GITHUB_SHA" --title "Kaijustomp suburb evolution ${GITHUB_RUN_NUMBER}" --notes-file "$RUNNER_TEMP/suburb-notes.md" --prerelease
          LOCAL_SIZE=$(stat -c "%s" "build/android/$APK_NAME")
